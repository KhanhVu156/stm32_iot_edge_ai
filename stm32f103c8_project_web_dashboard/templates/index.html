<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STM32 IoT Console</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-200 transition-colors duration-300 min-h-screen font-sans antialiased selection:bg-indigo-500/30">

    <header class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-tight text-slate-900 dark:text-white">STM32 <span class="text-indigo-600 dark:text-indigo-400">Console</span></h1>
                    <p class="text-[10px] text-slate-500 dark:text-slate-400 uppercase tracking-widest font-semibold">Edge Device Interface</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-emerald-50 text-emerald-700 dark:bg-emerald-500/10 dark:text-emerald-400 rounded-md text-xs font-medium border border-emerald-200 dark:border-emerald-500/20">
                    <span id="connection-dot" class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
                    <span id="connection-status">Đã kết nối</span>
                </div>
                
                <button id="theme-toggle" type="button" class="p-2 rounded-md text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800 transition-colors">
                    <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-6 h-[calc(100vh-4rem)]">
        
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 shrink-0">
            
            <!-- Thẻ Nhiệt độ tích hợp AI -->
            <div id="card-temp" class="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm flex items-center justify-between transition-colors duration-300">
                <div>
                    <p class="text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Nhiệt độ (LM35)</p>
                    <div class="flex items-baseline gap-1">
                        <span id="stat-temp" class="text-2xl font-bold text-slate-900 dark:text-white">--</span>
                        <span class="text-sm font-medium text-slate-500">°C</span>
                    </div>
                    <p id="ai-status" class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-wider">AI: WAITING</p>
                </div>
                <div id="temp-icon-container" class="w-10 h-10 rounded-full bg-orange-50 dark:bg-orange-500/10 flex items-center justify-center text-orange-500 transition-colors duration-300">
                    <svg id="icon-normal" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    <svg id="icon-warning" class="hidden w-5 h-5 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                </div>
            </div>

            <div class="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Trạng thái</p>
                    <span id="stat-state" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-bold bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400">STOPPED</span>
                </div>
                <div class="w-10 h-10 rounded-full bg-indigo-50 dark:bg-indigo-500/10 flex items-center justify-center text-indigo-500">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
            </div>

            <div class="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">LED đang bật</p>
                    <div class="flex items-baseline gap-1">
                        <span id="stat-leds" class="text-2xl font-bold text-slate-900 dark:text-white">0</span>
                        <span class="text-sm font-medium text-slate-500">/ 8</span>
                    </div>
                </div>
                <div class="w-10 h-10 rounded-full bg-yellow-50 dark:bg-yellow-500/10 flex items-center justify-center text-yellow-500">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                </div>
            </div>

            <div class="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Giao tiếp</p>
                    <p class="text-sm font-bold text-slate-900 dark:text-white">UART 115200</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-emerald-50 dark:bg-emerald-500/10 flex items-center justify-center text-emerald-500">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1 min-h-0">
            
            <div class="lg:col-span-8 flex flex-col bg-slate-100 dark:bg-slate-950 rounded-xl shadow-2xl border border-slate-300 dark:border-slate-800 overflow-hidden relative group transition-colors duration-300">
                <div class="bg-slate-200 dark:bg-slate-900/80 px-4 py-3 flex items-center justify-between border-b border-slate-300 dark:border-slate-800/80 transition-colors duration-300">
                    <div class="flex items-center gap-3">
                        <div class="flex gap-1.5">
                            <div class="w-2.5 h-2.5 rounded-full bg-slate-400 dark:bg-slate-700"></div>
                            <div class="w-2.5 h-2.5 rounded-full bg-slate-400 dark:bg-slate-700"></div>
                            <div class="w-2.5 h-2.5 rounded-full bg-slate-400 dark:bg-slate-700"></div>
                        </div>
                        <span class="text-xs font-mono text-slate-600 dark:text-slate-400 font-medium tracking-wide">LIVE UART STREAM</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
                            <span class="text-[10px] text-emerald-600 dark:text-emerald-500 font-bold tracking-wider uppercase">Receiving</span>
                        </div>
                        <button onclick="clearTerminal()" class="text-xs font-medium text-slate-500 hover:text-red-500 dark:text-slate-500 dark:hover:text-red-400 transition-colors bg-slate-300 dark:bg-slate-800/50 px-2 py-1 rounded">
                            Clear Log
                        </button>
                    </div>
                </div>
                <div id="terminal" class="flex-1 p-4 overflow-y-auto font-mono text-[13px] leading-relaxed space-y-0.5 custom-scrollbar bg-white dark:bg-slate-950 text-slate-800 dark:text-slate-300 transition-colors duration-300">
                    <div class="text-slate-400 dark:text-slate-600 italic select-none">// Hệ thống đang chờ dữ liệu từ cổng COM...</div>
                </div>
            </div>

            <div class="lg:col-span-4 flex flex-col gap-6 min-h-0">
                <!-- Nút START/STOP -->
                <div class="bg-white dark:bg-slate-900 p-5 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm shrink-0">
                    <h2 class="text-sm font-semibold text-slate-900 dark:text-white mb-3 flex items-center gap-2">
                        <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Hệ Thống
                    </h2>
                    <div class="flex gap-2">
                        <button onclick="quickCmd('START')" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-medium py-2.5 rounded-lg shadow-sm transition-all active:scale-95 flex items-center justify-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            START
                        </button>
                        <button onclick="quickCmd('STOP')" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-medium py-2.5 rounded-lg shadow-sm transition-all active:scale-95 flex items-center justify-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path></svg>
                            STOP
                        </button>
                    </div>
                </div>

                <!-- Terminal Input -->
                <div class="bg-white dark:bg-slate-900 p-5 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm shrink-0">
                    <h2 class="text-sm font-semibold text-slate-900 dark:text-white mb-3 flex items-center gap-2">
                        <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        Terminal Input
                    </h2>
                    <div class="flex gap-2">
                        <div class="relative flex-1">
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 font-mono text-sm pointer-events-none">></span>
                            <input type="text" id="cmdInput" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg pl-8 pr-4 py-2.5 text-sm font-mono focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-slate-900 dark:text-white placeholder-slate-400" placeholder="LED ON 3">
                        </div>
                        <button onclick="sendCommand()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2.5 rounded-lg shadow-sm transition-all active:scale-95">
                            Send
                        </button>
                    </div>
                </div>

                <!-- Output Channels -->
                <div class="bg-white dark:bg-slate-900 p-5 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm flex-1 flex flex-col min-h-0">
                    <div class="flex items-center justify-between mb-4 shrink-0">
                        <h2 class="text-sm font-semibold text-slate-900 dark:text-white flex items-center gap-2">
                            <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                            Output Channels
                        </h2>
                        <span class="text-[10px] font-mono text-slate-400 bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded">1 - 8</span>
                    </div>
                    
                    <div id="ledGrid" class="grid grid-cols-2 gap-2 overflow-y-auto pr-1 custom-scrollbar">
                        <!-- JS sẽ sinh 8 khối toggle ở đây -->
                    </div>

                    <div class="mt-4 pt-4 border-t border-slate-100 dark:border-slate-800 shrink-0">
                        <button onclick="quickCmd('STATUS')" class="w-full bg-slate-50 hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 text-xs font-semibold py-2.5 rounded-lg transition-all flex items-center justify-center gap-2">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Get System Status
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .terminal-line { animation: slideIn 0.2s ease-out; }
    </style>

    <script>
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');
        const htmlClass = document.documentElement.classList;

        if (localStorage.getItem('color-theme') === 'light') {
            htmlClass.remove('dark');
        } else {
            htmlClass.add('dark');
        }

        const updateIcon = () => {
            if (htmlClass.contains('dark')) {
                lightIcon.classList.add('hidden');
                darkIcon.classList.remove('hidden');
            } else {
                lightIcon.classList.remove('hidden');
                darkIcon.classList.add('hidden');
            }
        };
        updateIcon();

        themeToggleBtn.addEventListener('click', () => {
            htmlClass.toggle('dark');
            localStorage.setItem('color-theme', htmlClass.contains('dark') ? 'dark' : 'light');
            updateIcon();
        });

        const ledGrid = document.getElementById('ledGrid');
        for (let i = 1; i <= 8; i++) {
            ledGrid.innerHTML += `
                <div class="group flex items-center justify-between p-2.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700/50 rounded-lg hover:border-indigo-300 dark:hover:border-indigo-500/50 transition-all">
                    <span class="text-xs font-mono font-semibold text-slate-600 dark:text-slate-400 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors">LED_${i}</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toggle-led-${i}" class="sr-only peer" onchange="toggleLed(${i}, this.checked)">
                        <div class="w-9 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all dark:border-slate-600 peer-checked:bg-indigo-500"></div>
                    </label>
                </div>
            `;
        }

        let isSending = false;

        function toggleLed(ledNum, isChecked) {
            if (isSending) {
                document.getElementById(`toggle-led-${ledNum}`).checked = !isChecked;
                return;
            }

            const cmd = isChecked ? `LED ON ${ledNum}` : `LED OFF ${ledNum}`;
            
            isSending = true;
            const allToggles = document.querySelectorAll('input[type="checkbox"]');
            allToggles.forEach(t => {
                t.disabled = true;
                t.parentElement.classList.add('opacity-50', 'cursor-not-allowed');
            });

            sendCommandData(cmd);
            updateLedCount();

            setTimeout(() => {
                isSending = false;
                allToggles.forEach(t => {
                    t.disabled = false;
                    t.parentElement.classList.remove('opacity-50', 'cursor-not-allowed');
                });
            }, 300);
        }

        function updateLedCount() {
            const checked = document.querySelectorAll('input[type="checkbox"]:checked').length;
            document.getElementById('stat-leds').textContent = checked;
        }

        const socket = io('http://127.0.0.1:5000');
        const terminal = document.getElementById('terminal');

        socket.on('connect', () => {
            document.getElementById('connection-status').textContent = 'Đã kết nối';
            document.getElementById('connection-dot').className = 'w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse';
        });
        
        socket.on('disconnect', () => {
            document.getElementById('connection-status').textContent = 'Mất kết nối';
            document.getElementById('connection-dot').className = 'w-1.5 h-1.5 bg-red-500 rounded-full';
        });

        function appendToTerminal(text) {
            const div = document.createElement('div');
            div.className = 'terminal-line py-0.5 border-b border-slate-200 dark:border-slate-800/50 last:border-0 transition-colors duration-300';
            
            let colorClass = 'text-slate-700 dark:text-slate-300';
            let prefix = '>';
            let prefixColor = 'text-slate-400 dark:text-slate-500';
            
            if (text.includes('[ERROR]')) {
                colorClass = 'text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-950/30';
                prefix = '✗';
                prefixColor = 'text-red-500';
            } else if (text.includes('[SYSTEM]')) {
                colorClass = 'text-indigo-600 dark:text-indigo-300 font-medium';
                prefix = '⚙';
                prefixColor = 'text-indigo-500';
            } else if (text.includes('[AI]')) {
                colorClass = 'text-yellow-600 dark:text-yellow-200';
                prefix = '★';
                prefixColor = 'text-yellow-500';
            } else if (text.includes('[UART]')) {
                colorClass = 'text-yellow-600 dark:text-yellow-200';
                prefix = '⇄';
                prefixColor = 'text-yellow-500';
            }

            const prefixSpan = document.createElement('span');
            prefixSpan.className = `mr-2 font-bold ${prefixColor} select-none`;
            prefixSpan.textContent = prefix;
            
            const textSpan = document.createElement('span');
            textSpan.className = colorClass;
            textSpan.textContent = text;
            
            div.appendChild(prefixSpan);
            div.appendChild(textSpan);
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;

            updateStatsFromText(text);
        }

        socket.on('serial_data', (msg) => appendToTerminal(msg.data));

        function clearTerminal() {
            terminal.innerHTML = '<div class="text-slate-400 dark:text-slate-600 italic select-none">// Đã xóa log...</div>';
        }

        function updateStatsFromText(text) {
            // 1. Cập nhật Nhiệt độ
            const tempMatch = text.match(/TEMP:\s*(-?\d+|ERR)/);
            if (tempMatch) {
                document.getElementById('stat-temp').textContent = tempMatch[1];
            }

            // 2. Cập nhật trạng thái AI (NORMAL / ANOMALY)
            const cardTemp = document.getElementById('card-temp');
            const aiStatus = document.getElementById('ai-status');
            const iconNormal = document.getElementById('icon-normal');
            const iconWarning = document.getElementById('icon-warning');
            const tempIconContainer = document.getElementById('temp-icon-container');

            if (text.includes('AI: ANOMALY')) {
                // Kích hoạt cảnh báo đỏ
                cardTemp.classList.add('bg-red-50', 'border-red-300', 'dark:bg-red-900/20', 'dark:border-red-500/50');
                cardTemp.classList.remove('bg-white', 'dark:bg-slate-900', 'border-slate-200', 'dark:border-slate-800');
                
                aiStatus.textContent = 'AI: CẢNH BÁO';
                aiStatus.className = 'text-[10px] font-bold text-red-500 mt-1 uppercase tracking-wider animate-pulse';

                tempIconContainer.className = 'w-10 h-10 rounded-full bg-red-100 dark:bg-red-500/20 flex items-center justify-center text-red-500 transition-colors duration-300';
                iconNormal.classList.add('hidden');
                iconWarning.classList.remove('hidden');
            } 
            else if (text.includes('AI: NORMAL')) {
                // Trở về bình thường
                cardTemp.classList.remove('bg-red-50', 'border-red-300', 'dark:bg-red-900/20', 'dark:border-red-500/50');
                cardTemp.classList.add('bg-white', 'dark:bg-slate-900', 'border-slate-200', 'dark:border-slate-800');
                
                aiStatus.textContent = 'AI: BÌNH THƯỜNG';
                aiStatus.className = 'text-[10px] font-bold text-emerald-500 mt-1 uppercase tracking-wider';

                tempIconContainer.className = 'w-10 h-10 rounded-full bg-orange-50 dark:bg-orange-500/10 flex items-center justify-center text-orange-500 transition-colors duration-300';
                iconNormal.classList.remove('hidden');
                iconWarning.classList.add('hidden');
            }

            // 3. Cập nhật Trạng thái RUN/STOP
            const stateEl = document.getElementById('stat-state');
            // Thêm điều kiện text.includes('[AI]') để đồng bộ trạng thái khi hệ thống đang chạy
            if (text.includes('Chuyen sang RUN') || text.includes('[AI]')) {
                stateEl.textContent = 'RUNNING';
                stateEl.className = 'inline-flex items-center px-2 py-0.5 rounded text-xs font-bold bg-emerald-100 text-emerald-700 dark:bg-emerald-500/20 dark:text-emerald-400';
            } else if (text.includes('Chuyen sang STOP')) {
                stateEl.textContent = 'STOPPED';
                stateEl.className = 'inline-flex items-center px-2 py-0.5 rounded text-xs font-bold bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400';
            }
        }

        function sendCommandData(cmd) {
            appendToTerminal(`(Gửi) ${cmd}`);
            fetch('/send_command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: cmd })
            }).then(res => res.json()).then(data => {
                if(data.status !== 'success') appendToTerminal('Lỗi: ' + data.message);
            });
        }

        function sendCommand() {
            const input = document.getElementById('cmdInput');
            const cmd = input.value.trim();
            if (!cmd) return;
            sendCommandData(cmd);
            input.value = '';
        }

        function quickCmd(cmd) {
            sendCommandData(cmd);
        }
    </script>
</body>
</html>
